version: "3"
services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "win10"  # Altere para outra versão do Windows se desejar   
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    stop_grace_period: 2m
    restart: on-failure
    environment:
      VERSION: "win10"
      RAM_SIZE: "16G"
      CPU_CORES: "4"
      DISK_SIZE: "256G"
    volumes:
      - ./data:/storage/shared/
